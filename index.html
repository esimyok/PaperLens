<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="PaperLens —— 本地文献智能提炼表格：拖入 PDF，AI 自动提取研究问题、方法、结论等结构化字段，支持 Zotero 联动、文献问答、中英翻译与 CSV 导出。数据仅存本机。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
<title>PaperLens · 文献智能提炼表格</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --border:#e2e5ea; --text:#1f2430; --muted:#6b7280;
    --primary:#4f6ef2; --primary-dark:#3d57c9; --ok:#16a34a; --warn:#d97706; --err:#dc2626;
    --chip-bg:#eef1fe; --chip-text:#3d57c9;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
  header{background:var(--panel);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;}
  header h1{font-size:18px;font-weight:700;margin-right:auto;}
  header h1 span{color:var(--primary);}
  .btn{border:1px solid var(--border);background:var(--panel);color:var(--text);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;transition:.15s;}
  .btn:hover{border-color:var(--primary);color:var(--primary);}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
  .btn.primary:hover{background:var(--primary-dark);}
  .btn.small{padding:3px 9px;font-size:12px;border-radius:6px;}
  .btn.danger:hover{border-color:var(--err);color:var(--err);}
  main{padding:16px 24px;max-width:100%;}

  #dropzone{border:1px dashed #c3c9d4;border-radius:10px;background:var(--panel);padding:10px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.2s;margin-bottom:12px;}
  #dropzone:hover,#dropzone.dragover{border-color:var(--primary);background:#f7f9ff;}
  #dropzone .icon{font-size:20px;flex:none;}
  #dropzone .dz-text{flex:1;min-width:0;}
  #dropzone .main-line{font-size:13.5px;font-weight:600;}
  #dropzone .sub-line{color:var(--muted);font-size:12px;margin-top:2px;}
  #btn-zotero{flex:none;}
  #btn-zotero[data-state="on"]{color:var(--ok);border-color:var(--ok);}
  #btn-zotero[data-state="err"]{color:var(--err);border-color:var(--err);}

  /* 筛选工具栏 */
  #toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
  #toolbar input,#toolbar select{border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px;background:var(--panel);}
  #toolbar input:focus,#toolbar select:focus{outline:none;border-color:var(--primary);}
  #f-q{flex:1;min-width:180px;}
  #f-count{font-size:12px;color:var(--muted);}

  .table-wrap{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:auto;max-height:calc(100vh - 250px);}
  table{border-collapse:collapse;width:100%;min-width:1600px;}
  th{position:sticky;top:0;background:#f0f2f6;font-size:12.5px;color:#3a4150;padding:9px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;z-index:2;}
  td{padding:8px 10px;border-bottom:1px solid #eef0f4;vertical-align:top;font-size:13px;line-height:1.55;word-break:break-word;min-width:90px;max-width:230px;}
  td.editable{cursor:cell;}
  td.editable:hover{background:#f6f8ff;}
  tr[data-id]{cursor:pointer;}
  tr.selected{background:#eef3ff;}
  tr.selected td.editable:hover{background:#e2ebff;}
  td textarea.cell-editor{width:100%;min-width:160px;min-height:64px;font:inherit;padding:4px;border:2px solid var(--primary);border-radius:6px;resize:vertical;}
  .empty-tip{color:var(--muted);}
  .tag{display:inline-block;background:var(--chip-bg);color:var(--chip-text);border-radius:10px;padding:1px 8px;font-size:12px;margin:2px 3px 2px 0;white-space:nowrap;}
  .status{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;white-space:nowrap;}
  .st-parsing{background:#fff7e6;color:var(--warn);}
  .st-ai{background:#e8f0fe;color:var(--primary);}
  .st-done{background:#e8f7ee;color:var(--ok);}
  .st-fail{background:#fdecec;color:var(--err);}
  .err-msg{color:var(--err);font-size:12px;margin-top:4px;}
  .ops{white-space:nowrap;min-width:150px;}
  .ops .btn{margin-right:6px;margin-bottom:4px;}

  /* 设置弹窗 */
  .modal-mask{position:fixed;inset:0;background:rgba(20,24,34,.45);display:none;align-items:center;justify-content:center;z-index:100;}
  .modal-mask.show{display:flex;}
  .modal{background:var(--panel);border-radius:14px;padding:24px 26px;width:440px;box-shadow:0 12px 40px rgba(0,0,0,.18);max-height:88vh;overflow:auto;}
  .modal h2{font-size:16px;margin-bottom:16px;}
  .modal label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;}
  .modal input[type=password],.modal input[type=text],.modal select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--panel);}
  .modal input:focus,.modal select:focus{outline:none;border-color:var(--primary);}
  .modal .hint{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5;}
  .modal .foot{margin-top:20px;display:flex;justify-content:flex-end;gap:10px;}
  .modal .proxy-line{margin-top:14px;font-size:12.5px;background:#f6f8ff;border:1px solid #dfe6ff;border-radius:8px;padding:8px 10px;color:#3d57c9;display:none;}
  .modal .proxy-line.show{display:block;}

  /* 对话侧边栏 */
  #chat-panel{position:fixed;top:57px;right:0;bottom:0;width:380px;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;z-index:60;transform:translateX(105%);transition:transform .25s;box-shadow:-8px 0 24px rgba(0,0,0,.07);}
  #chat-panel.open{transform:none;}
  .chat-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);background:#fafbfd;}
  .chat-head .t{flex:1;min-width:0;}
  .chat-head .t b{font-size:14px;}
  .chat-paper{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #chat-msgs{flex:1;overflow:auto;display:flex;flex-direction:column;padding:10px;}
  .msg{max-width:86%;padding:8px 12px;border-radius:12px;margin:4px 0;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;}
  .msg.user{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px;}
  .msg.ai{align-self:flex-start;background:#f0f2f6;border-bottom-left-radius:4px;}
  .msg.ai.md{white-space:normal;}
  .msg.ai.md p{margin:4px 0;}
  .msg.ai.md h4{margin:8px 0 4px;font-size:13.5px;}
  .msg.ai.md ul,.msg.ai.md ol{margin:4px 0 4px 18px;}
  .msg.ai.md li{margin:2px 0;}
  .msg.ai.md pre.codeblock{background:#1f2430;color:#e8ecf5;border-radius:8px;padding:8px 10px;margin:6px 0;overflow:auto;font-size:12px;line-height:1.5;}
  .msg.ai.md pre.codeblock code{font-family:Consolas,monospace;white-space:pre;}
  .msg.ai.md code.inlinecode{background:#e2e5ee;color:#c2452d;border-radius:4px;padding:1px 5px;font-family:Consolas,monospace;font-size:12px;}
  .msg.ai.md table{border-collapse:collapse;margin:6px 0;font-size:12.5px;}
  .msg.ai.md th,.msg.ai.md td{border:1px solid #c9ced9;padding:3px 8px;}
  .msg.ai.thinking{color:var(--muted);}
  .chat-modelbar{display:flex;gap:6px;align-items:center;padding:8px 10px;border-top:1px solid var(--border);background:#fafbfd;}
  .chat-modelbar select,.chat-modelbar input{flex:1;min-width:0;border:1px solid var(--border);border-radius:8px;padding:5px 6px;font-size:12.5px;background:var(--panel);color:var(--text);}
  .chat-modelbar select:focus,.chat-modelbar input:focus{outline:none;border-color:var(--primary);}
  .chat-modelbar .btn{flex:none;}
  .chat-empty{margin:auto;color:var(--muted);font-size:13px;text-align:center;line-height:1.8;padding:0 20px;}
  .chat-input{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border);}
  #chat-in{flex:1;resize:none;height:64px;border:1px solid var(--border);border-radius:8px;padding:8px;font:inherit;font-size:13px;}
  #chat-in:focus{outline:none;border-color:var(--primary);}

  #toast-box{position:fixed;top:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:8px;}
  .toast{background:#2b3140;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:360px;animation:slidein .25s;}
  .toast.ok{background:var(--ok);} .toast.err{background:var(--err);} .toast.warn{background:var(--warn);}
  @keyframes slidein{from{transform:translateX(30px);opacity:0;}to{transform:none;opacity:1;}}
  #global-progress{font-size:12.5px;color:var(--primary);margin-bottom:8px;min-height:18px;}

  /* ==== v1.1 主题化 + 新增组件 ==== */
  :root{
    --th-bg:#f0f2f6; --row-line:#eef0f4; --cell-hover:#f6f8ff; --sel-bg:#eef3ff; --sel-hover:#e2ebff;
    --soft-bg:#fafbfd; --soft-hover:#f7f9ff; --bubble-ai:#f0f2f6; --toast-bg:#2b3140;
    --title-strong:#111827; --orig-text:#9ca3af; --bar-track:#edf0f5; --shadow:rgba(0,0,0,.18);
  }
  [data-theme="dark"]{
    --bg:#12151c; --panel:#1b202b; --border:#2a3140; --text:#e5e9f2; --muted:#8b93a7;
    --primary:#6d8bff; --primary-dark:#5877e8; --ok:#34d399; --warn:#fbbf24; --err:#f87171;
    --chip-bg:#26304a; --chip-text:#9db4ff;
    --th-bg:#202733; --row-line:#242b38; --cell-hover:#232b3a; --sel-bg:#24304d; --sel-hover:#2a3859;
    --soft-bg:#202634; --soft-hover:#232b3b; --bubble-ai:#242b39; --toast-bg:#333b4d;
    --title-strong:#f3f6ff; --orig-text:#7c8598; --bar-track:#242b38; --shadow:rgba(0,0,0,.5);
  }
  th{background:var(--th-bg);}
  td{border-bottom:1px solid var(--row-line);}
  td.editable:hover{background:var(--cell-hover);}
  tr[data-id]:hover{background:var(--cell-hover);}
  tr.selected{background:var(--sel-bg);}
  tr.selected:hover{background:var(--sel-hover);}
  tr.selected td.editable:hover{background:var(--sel-hover);}
  #dropzone:hover,#dropzone.dragover{background:var(--soft-hover);}
  .chat-head{background:var(--soft-bg);}
  .chat-modelbar{background:var(--soft-bg);}
  .msg.ai{background:var(--bubble-ai);}
  .toast{background:var(--toast-bg);}
  .modal{box-shadow:0 12px 40px var(--shadow);}
  .modal .proxy-line{background:var(--cell-hover);}
  td[data-key="title"]{font-weight:600;color:var(--title-strong);}
  .zh{font-weight:500;}
  .orig{display:block;color:var(--orig-text);font-size:11.5px;margin-top:2px;}
  .orig.clamped{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .orig-toggle{display:block;border:0;background:none;color:var(--primary);font-size:11.5px;padding:0;margin-top:2px;cursor:pointer;}
  .orig-toggle:hover{text-decoration:underline;}

  td{position:relative;}
  .ccopy{position:absolute;top:4px;right:4px;border:1px solid var(--border);background:var(--panel);color:var(--muted);
    border-radius:6px;font-size:11px;line-height:1;padding:3px 5px;cursor:pointer;opacity:0;transition:.15s;}
  td:hover .ccopy{opacity:1;}
  .ccopy:hover{color:var(--primary);border-color:var(--primary);}

  .menu{position:fixed;z-index:300;background:var(--panel);border:1px solid var(--border);border-radius:10px;
    box-shadow:0 8px 24px var(--shadow);padding:6px;min-width:190px;max-height:70vh;overflow:auto;}
  .menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;
    font-size:13px;cursor:pointer;color:var(--text);white-space:nowrap;}
  .menu button:hover{background:var(--cell-hover);}

  #link-import{display:flex;gap:8px;margin-bottom:12px;}
  #link-in{flex:1;border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:13px;background:var(--panel);color:var(--text);}
  #link-in:focus{outline:none;border-color:var(--primary);}

  .bar-row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12.5px;}
  .bar-label{width:170px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);flex:none;}
  .bar-track{flex:1;height:14px;background:var(--bar-track);border-radius:7px;overflow:hidden;}
  .bar{height:100%;background:var(--primary);border-radius:7px;min-width:2px;}
  .bar-num{width:32px;color:var(--muted);flex:none;}
  .stats-summary{font-size:13px;color:var(--muted);margin-bottom:12px;}
  .stats-section{font-size:13px;font-weight:600;margin:12px 0 4px;color:var(--title-strong);}

  .eg-steps{font-size:13px;line-height:2;}
  .eg-note{font-size:11.5px;margin-top:6px;color:var(--muted);}
  .ops{min-width:200px;}
  body{transition:background .2s,color .2s;}
</style>
</head>
<body>
<header>
  <h1>PaperLens <span>· 文献智能提炼表格</span></h1>
  <button class="btn" id="btn-chat">💬 问答</button>
  <button class="btn" id="btn-stats">📊 统计</button>
  <button class="btn" id="btn-theme" title="切换深色 / 浅色">🌙 深色</button>
  <button class="btn" id="btn-zotero" data-state="off" title="开启后在 Zotero 中选中文献，本页自动抓取并分析">🔌 Zotero 联动：关</button>
  <button class="btn" id="btn-export">导出 ▾</button>
  <button class="btn" id="btn-settings">⚙ 设置</button>
</header>
<main>
  <div id="dropzone">
    <div class="icon">📄</div>
    <div class="dz-text">
      <div class="main-line">将 PDF 拖到此处，或点击选择文件（可多选）</div>
      <div class="sub-line">仅支持 .pdf（扫描件会自动 OCR，较慢）· 点击表格行可在「问答」中针对该文献提问 · Ctrl+点击可选中多篇合并问答</div>
    </div>
  </div>
  <input type="file" id="file-input" accept=".pdf" multiple hidden>
  <input type="file" id="backup-input" accept=".json" hidden>
  <div id="link-import">
    <input id="link-in" placeholder="或粘贴 arXiv 链接 / DOI（如 10.1038/xxx），回车导入：arXiv 自动下载 PDF 分析，DOI 先导入元数据">
    <button class="btn" id="btn-link">导入</button>
  </div>
  <div id="toolbar">
    <input id="f-q" placeholder="🔍 搜索：标题 / 作者 / 关键词 / 内容…">
    <select id="f-year"><option value="all">年份：全部</option></select>
    <select id="f-kw"><option value="all">关键词：全部</option></select>
    <select id="f-status">
      <option value="all">状态：全部</option>
      <option value="done">完成</option>
      <option value="fail">失败</option>
      <option value="ai">AI 分析中</option>
      <option value="parsing">解析中</option>
    </select>
    <button class="btn small" id="f-clear">清除筛选</button>
    <button class="btn small" id="btn-cols">列设置 ▾</button>
    <span id="f-count"></span>
  </div>
  <div id="global-progress"></div>
  <div class="table-wrap">
    <table>
      <thead><tr id="thead-row"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</main>

<div class="modal-mask" id="settings-mask">
  <div class="modal">
    <h2>设置</h2>
    <label>AI 服务商</label>
    <select id="inp-provider"></select>
    <label>API Key（当前服务商）</label>
    <input type="password" id="inp-key" placeholder="请输入 API Key，仅保存在本机浏览器 localStorage">
    <div class="hint" id="key-hint"></div>
    <label>模型（直接手动输入即可，下拉仅为常用建议）</label>
    <input type="text" id="inp-model" list="model-list" placeholder="模型名">
    <datalist id="model-list"></datalist>
    <div class="proxy-line" id="proxy-line">⚠ 浏览器直连智谱失败（CORS），已自动切换为「本地代理模式」。<br>请先在工具目录运行：<b>node proxy.js</b>（需 npm install express）</div>
    <div class="foot">
      <button class="btn" id="btn-cancel">取消</button>
      <button class="btn primary" id="btn-save">保存</button>
    </div>
  </div>
</div>

<div id="chat-panel">
  <div class="chat-head">
    <div class="t">
      <b>💬 文献问答</b>
      <div class="chat-paper" id="chat-paper">未选择文献 —— 点击表格任意一行</div>
    </div>
    <button class="btn small" id="chat-clear">清空</button>
    <button class="btn small" id="chat-close">收起 ▶</button>
  </div>
  <div id="chat-msgs"></div>
  <div class="chat-modelbar">
    <select id="chat-provider" title="切换 AI 服务商"></select>
    <input id="chat-model" list="chat-model-list" placeholder="模型名，可手动输入">
    <datalist id="chat-model-list"></datalist>
    <button class="btn small" id="chat-manage">管理模型</button>
  </div>
  <div class="chat-input">
    <textarea id="chat-in" placeholder="基于选中的文献提问…&#10;Enter 发送，Shift+Enter 换行"></textarea>
    <button class="btn primary" id="chat-send">发送</button>
  </div>
</div>
<div class="modal-mask" id="stats-mask">
  <div class="modal" style="width:540px;">
    <h2>📊 文献统计</h2>
    <div id="stats-body"></div>
    <div class="foot">
      <button class="btn" id="btn-stats-close">关闭</button>
    </div>
  </div>
</div>

<div id="menu" class="menu" hidden></div>
<div id="toast-box"></div>

<script>
"use strict";
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

/* ============ 常量 ============ */
const LS_KEY = "paperlens_records";
const LS_SETTINGS = "paperlens_settings";
const MAX_CHARS = 60000;
const PROXY_BASE = "http://localhost:3001";
const SYSTEM_PROMPT = "你是学术论文分析助手。请从用户提供的文献文本中提取结构化信息，严格只输出一个 JSON 对象，不要输出任何其他文字、解释或 markdown 代码块。若某字段无法从文本中找到，填写\"未提及\"。keywords 为 3-6 个字符串组成的数组，authors 为字符串数组。禁止虚构内容。";
const JSON_SCHEMA_HINT = '\n\n请严格按以下 JSON Schema 输出（所有字段必须存在）：\n{"title":"","authors":[],"year":"","keywords":[],"research_question":"","methodology":"","data_and_sample":"","main_findings":"","innovation":"","limitations":"","one_sentence_summary":""}';
const TRANSLATE_PROMPT = "你是学术文献翻译助手。用户会给你一个 JSON，请把其中 title、one_sentence_summary、main_findings 全部翻译成简体中文（专业术语准确、语句通顺）。严格只输出一个 JSON 对象：{\"title_zh\":\"...\",\"summary_zh\":\"...\",\"findings_zh\":\"...\"}，三个字段都必须存在，不要输出任何其他文字或 markdown 代码块。禁止编造。";
const CHAT_PROMPT = "你是学术论文问答助手。请只依据下面提供的文献内容回答用户问题，用中文、简洁准确；文献中没有的信息要明确回答\"文献中未提及\"，禁止编造。\n\n===== 文献内容 =====\n";
const CHAT_PROMPT_MULTI = "你是学术论文问答助手。用户提供了多篇文献的内容，请综合对比这些文献回答问题，用中文、简洁准确；可以指出文献之间的异同；文献中没有的信息要明确回答\"文献中未提及\"，禁止编造。\n\n===== 文献内容 =====\n";

const PROVIDERS = {
  glm:     {name:"智谱 GLM",   base:"https://open.bigmodel.cn/api/paas/v4",                style:"openai",    json:true,  models:["glm-4-flash-250414","glm-4.7-flash","glm-4.6","glm-4-plus"], hint:"https://open.bigmodel.cn（glm-4-flash 系列免费）"},

/* ============ 工具函数 ============ */
const $ = s => document.querySelector(s);
function esc(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg, type="", ms=4000){
  const t=document.createElement("div"); t.className="toast "+type; t.textContent=msg;
  $("#toast-box").appendChild(t); setTimeout(()=>t.remove(), ms);

function loadState(){
  try{ records = JSON.parse(localStorage.getItem(LS_KEY)) || []; }catch(e){ records=[]; }
  try{ Object.assign(settings, JSON.parse(localStorage.getItem(LS_SETTINGS)) || {}); }catch(e){}
  // 旧版单 Key 配置迁移到 glm
  if(settings.apiKey && !(settings.providers && settings.providers.glm)){
    settings.providers = settings.providers || {};
    settings.providers.glm = { key: settings.apiKey, model: settings.model || PROVIDERS.glm.models[0] };
  }
  settings.provider = settings.provider || "glm";
  settings.providers = settings.providers || {};
  settings.hiddenCols = Array.isArray(settings.hiddenCols) ? settings.hiddenCols : ["data_and_sample","innovation","limitations"];
  // 旧版数据里全文存在 localStorage：迁移到 IndexedDB，避免撑爆 5MB 配额
  (async ()=>{
    for(const r of records){
      if(typeof r.text === "string" && r.text){
        textCache[r.id] = r.text;
        try{ await idbSet(r.id, r.text); }catch(e){}
        delete r.text;
      }
    }
    saveRecords();
  })();
  // 中断恢复：上次页面关闭时未完成的分析标记为失败，允许重新分析
  let interrupted = false;
  for(const r of records){
    if(r.status==="parsing" || r.status==="ai"){
      r.status = "fail"; r.statusText = "已中断";
      r.errMsg = "上次分析未完成（页面被关闭），可点「重新分析」继续";
      interrupted = true;
    }
  }
  if(interrupted) saveRecords();
}
function saveRecords(){
  // 全文存 IndexedDB（textCache），localStorage 只存表格字段，防配额溢出
  const slim = records.map(r=>{ const {text, ...rest} = r; return rest; });
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(slim));
  }catch(e){
    toast("浏览器存储空间不足，表格数据可能未保存！请点「导出 → 备份(JSON)」并清理少量记录", "err", 10000);
  }
}
function saveSettings(){ localStorage.setItem(LS_SETTINGS, JSON.stringify(settings)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function waitTurn(){
  return new Promise(res=>{
    const timer = setInterval(()=>{ if(!busy){ clearInterval(timer); res(); } }, 200);
  });
}

/* ============ IndexedDB：全文存储（localStorage 只存表格字段） ============ */
const textCache = {};     // recordId -> 全文
function idbOpen(){
  return new Promise((res,rej)=>{
    const q = indexedDB.open("paperlens", 1);
    q.onupgradeneeded = ()=>{ if(!q.result.objectStoreNames.contains("texts")) q.result.createObjectStore("texts"); };
    q.onsuccess = ()=>res(q.result);
    q.onerror = ()=>rej(q.error);
  });
}
async function idbSet(k,v){
  const db = await idbOpen();
  return new Promise((res,rej)=>{ const tx=db.transaction("texts","readwrite"); tx.objectStore("texts").put(v,k); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); });
}
async function idbGet(k){
  const db = await idbOpen();
  return new Promise((res,rej)=>{ const rq=db.transaction("texts","readonly").objectStore("texts").get(k); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); });
}
async function idbDel(k){
  const db = await idbOpen();
  return new Promise((res,rej)=>{ const tx=db.transaction("texts","readwrite"); tx.objectStore("texts").delete(k); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); });
}
async function idbClearAll(){
  const db = await idbOpen();
  return new Promise((res,rej)=>{ const tx=db.transaction("texts","readwrite"); tx.objectStore("texts").clear(); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); });
}
function setText(rec, text){
  rec.text = text; textCache[rec.id] = text;
  idbSet(rec.id, text).catch(()=>{});
}

  catch(e){
    const ta = document.createElement("textarea"); ta.value = t;
    document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();

const menuEl = () => $("#menu");
function openMenu(anchor, items, stayOpen=false){
  const m = menuEl();
  m.innerHTML = "";
  for(const it of items){
    const b = document.createElement("button");
    b.textContent = it.label;
    b.addEventListener("click", ()=>{ if(!stayOpen) m.hidden = true; it.action(); });

  m.style.left = Math.max(8, Math.min(r.left, innerWidth - m.offsetWidth - 8)) + "px";
  m.style.top = Math.min(r.bottom + 6, innerHeight - m.offsetHeight - 8) + "px";
}
document.addEventListener("click", e=>{

  if(!m.hidden && !m.contains(e.target)) m.hidden = true;

/* ============ PDF 解析（含扫描件 OCR 兜底） ============ */
async function extractPdfText(file, onProgress){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  const total = pdf.numPages;
  let text = "";
  for(let i=1;i<=total;i++){
    onProgress(i, total);
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent();
    text += tc.items.map(it=>it.str).join(" ") + "\n";
  }
  text = text.replace(/[ \t]+/g," ").replace(/\n{3,}/g,"\n\n").trim();
  return { text, pages: total, pdf };
}
function truncateText(t, cap=MAX_CHARS){
  if(t.length <= cap) return t;
  const head = Math.floor(cap*0.8), tail = cap - head;
  return t.slice(0,head) + "\n\n……[中间内容已截断]……\n\n" + t.slice(-tail);
}
/* 扫描件 OCR：tesseract.js 懒加载（首次使用才从 CDN 下载） */
function loadTesseract(){
  return new Promise((res,rej)=>{
    if(window.Tesseract) return res();
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js";
    s.onload = ()=>res();
    s.onerror = ()=>rej(new Error("OCR 组件加载失败（需要联网）"));
    document.head.appendChild(s);
  });
}
async function ocrPdf(pdf, onProgress){
  await loadTesseract();
  let out = "";
  for(let i=1;i<=pdf.numPages;i++){
    onProgress(i, pdf.numPages);
    const page = await pdf.getPage(i);
    const vp = page.getViewport({scale:2});
    const c = document.createElement("canvas");
    c.width = vp.width; c.height = vp.height;
    await page.render({canvasContext:c.getContext("2d"), viewport:vp}).promise;
    const r = await Tesseract.recognize(c, "chi_sim+eng");
    out += r.data.text + "\n";
  }
  return out.replace(/[ \t]+/g," ").replace(/\n{3,}/g,"\n\n").trim();
}

/* ============ AI 层（多服务商） ============ */
function pCfg(){
  const p = settings.provider || "glm";
  const saved = settings.providers[p] || {};
  return { id:p, ...PROVIDERS[p], key:saved.key||"", model:saved.model || PROVIDERS[p].models[0] };
}
function extractJsonText(raw){
  return raw.replace(/^```(?:json)?\s*/i,"").replace(/```\s*$/,"").trim();
}
async function callAIOnce(messages, json, viaProxy){
  const cfg = pCfg();
  if(!cfg.key) throw new Error(cfg.name + " 未配置 API Key，请点右上角「⚙ 设置」填写");
  const base = viaProxy ? (PROXY_BASE + "/pass/" + cfg.base.replace("https://","")) : cfg.base;
  let url, headers, body, parse;
  if(cfg.style === "anthropic"){
    url = base + "/messages";
    headers = { "Content-Type":"application/json", "x-api-key":cfg.key,
      "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" };
    body = { model:cfg.model, max_tokens:2000, temperature:0.2,
      system: (messages.find(m=>m.role==="system")||{}).content || "",
      messages: messages.filter(m=>m.role!=="system") };
    parse = d => (d.content && d.content[0] && d.content[0].text) || "";
  }else{
    url = base + "/chat/completions";
    headers = { "Content-Type":"application/json", "Authorization":"Bearer "+cfg.key };
    body = { model:cfg.model, temperature:0.2, messages };
    if(json && cfg.json) body.response_format = {type:"json_object"};
    parse = d => (d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content) || "";
  }
  const res = await fetch(url, {method:"POST", headers, body: JSON.stringify(body)});
  if(!res.ok){
    let detail = "";
    try{ const j = await res.json(); detail = (j.error && j.error.message) || j.message || ""; }catch(e){}
    if(res.status===401 || res.status===403) throw new Error(cfg.name + " API Key 无效或无权限（" + res.status + "）" + (detail?"："+detail:""));
    if(res.status===429) throw new Error(cfg.name + " 请求过于频繁（429），请稍后重试" + (detail?"："+detail:""));
    throw new Error(cfg.name + " 返回错误 " + res.status + (detail?"："+detail:""));
  }
  const data = await res.json();
  return parse(data);
}
/* 直连失败(TypeError, 即 CORS/网络)的兜底：glm 切代理模式；其它服务商经代理转发重试一次 */
async function callAI(messages, opts={}){
  const json = opts.json !== false;
  const pid = settings.provider || "glm";
  try{
    return await callAIOnce(messages, json, false);
  }catch(err){
    if(err instanceof TypeError){
      if(pid === "glm"){
        if(!settings.proxyMode){
          settings.proxyMode = true; saveSettings(); updateProxyHint();
          toast("浏览器直连失败（CORS），已切换本地代理模式，请确保已运行 node proxy.js", "warn", 6000);
        }
        try{ return await callAIOnce(messages, json, true); }
        catch(e2){
          throw new Error("浏览器直连被 CORS 拦截，且本地代理不可用。请先运行 node proxy.js 后重试");
        }
      }
      try{ return await callAIOnce(messages, json, true); }
      catch(e2){
        throw new Error("浏览器直连被 CORS 拦截，且本地代理不可用。请先运行 node proxy.js 后重试");
      }
    }
    throw err;
  }
}
async function callAIWithRetry(messages, opts={}){
  let lastErr;
  for(let attempt=0; attempt<3; attempt++){
    try{ return await callAI(messages, opts); }
    catch(e){
      lastErr = e;
      if(/Key 无效/.test(e.message)) throw e;
      if(attempt < 2) await sleep(2000 * Math.pow(2, attempt));
    }
  }
  throw lastErr;
}
function normalizeJson(obj){
  const fields = ["title","authors","year","keywords","research_question","methodology","data_and_sample","main_findings","innovation","limitations","one_sentence_summary"];
  const out = {};
  for(const f of fields){
    let v = obj[f];
    if(f==="authors" || f==="keywords"){
      if(typeof v === "string") v = v.split(/[,，、;；]/).map(s=>s.trim()).filter(Boolean);
      if(!Array.isArray(v)) v = [];
      v = v.map(x=>String(x).trim()).filter(Boolean);
      out[f] = v.length ? v : ["未提及"];
    }else{
      v = (v===undefined||v===null||v==="") ? "未提及" : String(v).trim();
      out[f] = v || "未提及";
    }
  }
  return out;
}

/* ============ 处理流程（顺序队列） ============ */
function emptyFields(){
  return { title:"—", authors:["未提及"], year:"—", keywords:["未提及"],
    research_question:"—", methodology:"—", data_and_sample:"—",
    main_findings:"—", innovation:"—", limitations:"—", one_sentence_summary:"—" };
}
async function handleFiles(fileList){
  const pdfs = [...fileList].filter(f=>/\.pdf$/i.test(f.name));
  if(pdfs.length === 0){ toast("仅支持 .pdf 文件", "err"); return; }
  for(const f of pdfs){
    const rec = { id:uid(), filename:f.name, status:"parsing", statusText:"", errMsg:"", text:"", ...emptyFields() };
    records.unshift(rec); saveRecords(); render();
    processRecord(rec, f);
  }
}
async function processRecord(rec, file){
  if(busy) await waitTurn();
  busy = true;
  try{
    rec.status="parsing"; rec.errMsg="";
    let { text, pages, pdf } = await extractPdfText(file, (i,n)=>{
      rec.statusText = `第 ${i}/${n} 页`; renderRowById(rec.id);
    });
    if(text.replace(/\s/g,"").length < 30){
      // 无文字层（扫描件）：OCR 兜底
      toast(`「${rec.filename}」未检测到文字层，正在用 OCR 识别（扫描件较慢，请耐心等待）`, "warn", 8000);
      rec.status="ai"; rec.statusText="OCR 识别中…"; renderRowById(rec.id);
      let ocrText = "";
      try{
        ocrText = await ocrPdf(pdf, (i,n)=>{
          rec.statusText = `OCR 第 ${i}/${n} 页`; renderRowById(rec.id);
        });
      }catch(ocrErr){
        throw new Error(ocrErr.message || "该 PDF 没有可提取的文本层（可能是扫描件），且 OCR 失败");
      }
      if(ocrText.replace(/\s/g,"").length < 30){
        throw new Error("OCR 后仍未提取到有效文本，该 PDF 可能是图片质量过低或空白页");
      }
      text = ocrText;
    }
    setText(rec, text); saveRecords();
    rec.status="ai"; rec.statusText="AI 分析中…"; renderRowById(rec.id);
    const raw = await callAIWithRetry([
      {role:"system", content: SYSTEM_PROMPT},
      {role:"user", content: truncateText(text) + JSON_SCHEMA_HINT}
    ], {json:true});
    Object.assign(rec, normalizeJson(JSON.parse(extractJsonText(raw))));
    rec.status="done"; rec.statusText="完成"; rec.errMsg="";
    toast(`「${rec.filename}」分析完成`, "ok");
  }catch(err){
    rec.status="fail"; rec.statusText="失败"; rec.errMsg=err.message || "未知错误";
    toast(`「${rec.filename}」处理失败：${rec.errMsg}`, "err", 6000);
  }finally{
    busy = false;
    saveRecords(); render();
  }
}

/* ============ 翻译 ============ */
async function translateRec(rec){
  (async ()=>{
    if(busy) await waitTurn(); busy = true;
    rec.translating = true; render();   // 立即反馈：状态列徽章 + 按钮变为「翻译中…」
    try{
      const src = JSON.stringify({ title: rec.title, one_sentence_summary: rec.one_sentence_summary, main_findings: rec.main_findings });
      const raw = await callAIWithRetry([
        {role:"system", content: TRANSLATE_PROMPT},
        {role:"user", content: src}
      ], {json:true});
      const r = JSON.parse(extractJsonText(raw));
      rec.title_zh = r.title_zh || "";
      rec.summary_zh = r.summary_zh || "";
      rec.findings_zh = r.findings_zh || "";
      toast(`「${rec.filename}」翻译完成（中文为主，原文折叠保留，可展开查看）`, "ok");
    }catch(err){
      toast(`翻译失败：${err.message}`, "err", 6000);
    }finally{
      rec.translating = false; busy = false;
      saveRecords(); render();
    }
  })();
}

/* ============ 筛选 ============ */
function statusLabel(r){
  return {parsing:"解析中", ai:"AI 分析中", done:"完成", fail:"失败"}[r.status] || "解析中";
}
function filteredRecords(){
  return records.filter(r=>{
    if(filters.year!=="all" && String(r.year||"—")!==filters.year) return false;
    if(filters.status!=="all" && statusLabel(r)!==filters.status) return false;
    if(filters.kw!=="all" && !(Array.isArray(r.keywords) && r.keywords.includes(filters.kw))) return false;
    if(filters.q){
      const q = filters.q.toLowerCase();
      const hay = [r.filename,r.title,r.title_zh,r.one_sentence_summary,r.summary_zh,r.research_question,
        r.methodology,r.main_findings,r.innovation,r.limitations]
        .concat(Array.isArray(r.authors)?r.authors:[r.authors])
        .concat(Array.isArray(r.keywords)?r.keywords:[r.keywords])
        .join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}
function refreshFilterOptions(){
  const years = [...new Set(records.map(r=>String(r.year||"—")))].filter(Boolean).sort();
  const kws = [...new Set(records.flatMap(r=>Array.isArray(r.keywords)?r.keywords:[r.keywords]).filter(k=>k&&k!=="未提及"))].sort();
  const fill = (sel, list, prefix, cur) => {
    const el = $(sel);
    el.innerHTML = `<option value="all">${prefix}：全部</option>` + list.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");
    el.value = list.includes(cur) ? cur : "all";
  };
  fill("#f-year", years, "年份", filters.year);
  fill("#f-kw", kws, "关键词", filters.kw);
  filters.year = $("#f-year").value; filters.kw = $("#f-kw").value;
  $("#f-status").value = filters.status;
}

/* ============ 渲染 ============ */
function statusBadge(rec){
  if(rec.translating) return `<span class="status st-ai">翻译中…</span>`;
  const map = { parsing:["st-parsing", rec.statusText?`解析中（${rec.statusText}）`:"解析中"],
    ai:["st-ai","AI 分析中…"], done:["st-done","完成"], fail:["st-fail","失败"] };
  const [cls, label] = map[rec.status] || ["st-parsing","解析中"];
  let html = `<span class="status ${cls}">${esc(label)}</span>`;
  if(rec.status==="fail" && rec.errMsg) html += `<div class="err-msg">${esc(rec.errMsg)}</div>`;
  return html;
}
/* 翻译对照：中文为主，原文默认折叠 3 行，可展开 */
function zhWithOrig(zh, orig){
  return `<span class="zh">${esc(zh)}</span><span class="orig clamped">原文：${esc(orig)}</span>` +
         `<button class="orig-toggle" type="button" title="展开 / 收起英文原文">展开原文 ▾</button>`;
}
function cellContent(rec, col){
  if(col.key==="status") return statusBadge(rec);
  let main;
  if(col.type==="list"){
    const arr = Array.isArray(rec[col.key])?rec[col.key]:[rec[col.key]];
    if(col.tag) main = arr.map(x=>`<span class="tag">${esc(x)}</span>`).join("") || `<span class="empty-tip">未提及</span>`;
    else main = arr.map(esc).join("; ") || `<span class="empty-tip">未提及</span>`;
  }else if(col.key==="title" && rec.title_zh){
    // 翻译对照：中文为主，原文折叠可展开
    return zhWithOrig(rec.title_zh, rec.title);
  }else if(col.key==="one_sentence_summary" && rec.summary_zh){
    return zhWithOrig(rec.summary_zh, rec.one_sentence_summary);
  }else if(col.key==="main_findings" && rec.findings_zh){
    return zhWithOrig(rec.findings_zh, rec.main_findings);
  }else{
    main = esc(rec[col.key]) || `<span class="empty-tip">未提及</span>`;
  }
  return main;
}
function cellRaw(rec, col){
  // 单元格复制按钮使用的纯文本（翻译字段 = 中文 + 换行 + 原文）
  if(col.type==="list"){
    const arr = Array.isArray(rec[col.key])?rec[col.key]:[rec[col.key]];
    return arr.filter(x=>x && x!=="未提及").join("; ");
  }
  if(col.key==="title" && rec.title_zh) return rec.title_zh + "\n" + rec.title;
  if(col.key==="one_sentence_summary" && rec.summary_zh) return rec.summary_zh + "\n" + rec.one_sentence_summary;
  if(col.key==="main_findings" && rec.findings_zh) return rec.findings_zh + "\n" + rec.main_findings;
  return String(rec[col.key] ?? "");
}

    let val = ta.value.trim();

      const arr = val ? val.split(/[,，、;；]/).map(s=>s.trim()).filter(Boolean) : [];
      rec[col.key] = arr.length ? arr : ["未提及"];

/* 轻量 Markdown 渲染（先整体转义 HTML，再解析常见标记） */
function inlineMd(s){
  return s.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
          .replace(/__([^_]+)__/g,"<b>$1</b>")
          .replace(/(^|[^*\w])\*([^*\n]+)\*/g,"$1<i>$2</i>");
}
function mdRender(src){
  let s = esc(src);
  const blocks = [];
  s = s.replace(/```([\s\S]*?)```/g, (_,c)=>{ blocks.push(c.replace(/^\w*\n/,"")); return "\u0000B"+(blocks.length-1)+"\u0000"; });
  const codes = [];
  s = s.replace(/`([^`\n]+)`/g, (_,c)=>{ codes.push(c); return "\u0000C"+(codes.length-1)+"\u0000"; });
  const lines = s.split("\n");
  let html = "", inUl=false, inOl=false;
  const closeLists=()=>{ if(inUl){html+="</ul>";inUl=false;} if(inOl){html+="</ol>";inOl=false;} };
  for(const ln of lines){
    const bp = ln.match(/^\u0000B(\d+)\u0000$/);
    if(bp){ closeLists(); html += `\u0000B${bp[1]}\u0000`; continue; }
    const h = ln.match(/^(#{1,4})\s+(.*)/);
    const ul = ln.match(/^\s*[-*•]\s+(.+)/);
    const ol = ln.match(/^\s*(\d+)[.、)）]\s+(.+)/);
    if(h){ closeLists(); html += `<h4>${inlineMd(h[2])}</h4>`; }
    else if(ul){ if(inOl){html+="</ol>";inOl=false;} if(!inUl){html+="<ul>";inUl=true;} html+=`<li>${inlineMd(ul[1])}</li>`; }
    else if(ol){ if(inUl){html+="</ul>";inUl=false;} if(!inOl){html+="<ol>";inOl=true;} html+=`<li>${inlineMd(ol[2])}</li>`; }
    else if(ln.trim()===""){ closeLists(); }
    else { closeLists(); html += `<p>${inlineMd(ln)}</p>`; }
  }
  closeLists();
  return html.replace(/\u0000B(\d+)\u0000/g,(_,i)=>`<pre class="codeblock"><code>${blocks[+i]}</code></pre>`)
             .replace(/\u0000C(\d+)\u0000/g,(_,i)=>`<code class="inlinecode">${codes[+i]}</code>`);
}
function msgHtml(m){
  if(m.role==="user") return esc(m.content);
  return '<div class="msg ai md">' + (m.content.startsWith("❌") ? esc(m.content) : mdRender(m.content)) + "</div>";
}

async function sendChat(){
  if(chatBusy) return;
  const recs = selectedRecords();
  if(!recs.length){ toast("请先点击表格中的一行文献（Ctrl+点击可多选），再提问", "warn"); return; }
  const inp = $("#chat-in");
  const text = inp.value.trim();
  if(!text) return;
  inp.value = "";
  // 会话历史按"选中集"隔离：单篇=记录 id；多篇=按 id 排序组合（换选即新会话）
  const hkey = recs.length===1 ? recs[0].id : recs.map(r=>r.id).sort().join("|");
  const hist = chatHistories[hkey] = chatHistories[hkey] || [];
  hist.push({role:"user", content:text});
  renderChat();
  chatBusy = true;
  const box = $("#chat-msgs");
  const think = document.createElement("div");
  think.className = "msg ai thinking"; think.textContent = "思考中…";
  box.appendChild(think); box.scrollTop = box.scrollHeight;
  try{
    let system;
    if(recs.length===1){
      const r = recs[0];
      const context = r.text
        ? truncateText(r.text)
        : `（未提取到全文，仅有元数据）标题：${r.title}；作者：${Array.isArray(r.authors)?r.authors.join(", "):r.authors}；年份：${r.year}`;
      system = CHAT_PROMPT + context + "\n===================";
    }else{
      // 多篇合并：每篇等额配额，总量不超过 MAX_CHARS
      const per = Math.max(8000, Math.floor(MAX_CHARS / recs.length));
      const context = recs.map((r,i)=>{
        const body = r.text ? truncateText(r.text, per)
          : `（未提取到全文，仅有元数据）标题：${r.title}；作者：${Array.isArray(r.authors)?r.authors.join(", "):r.authors}；年份：${r.year}`;
        return `【文献 ${i+1}】${r.title && r.title!=="—" ? r.title : r.filename}${r.year && r.year!=="—" ? "（"+r.year+"）" : ""}\n${body}`;
      }).join("\n\n");
      system = CHAT_PROMPT_MULTI + context + "\n===================";
    }
    const messages = [
      {role:"system", content: system},
      ...hist.slice(-10).map(m=>({role:m.role, content:m.content}))
    ];
    const answer = await callAIWithRetry(messages, {json:false});
    hist.push({role:"assistant", content:answer});
  }catch(err){
    hist.push({role:"assistant", content:"❌ 请求失败：" + err.message});
  }finally{
    chatBusy = false;
    renderChat();
  }
}

/* ============ 引用格式 / Markdown 导出 / 示例数据 ============ */
function realAuthors(authors){
  return (Array.isArray(authors)?authors:[]).filter(x=>x && x!=="未提及");
}
/* GB/T 7714：作者. 标题[J]. 年份.（无期刊元数据，类型标识用 [J] 简化，>3 位作者加"等"） */
function citeGBT(r){
  const a = realAuthors(r.authors);
  const who = a.length ? (a.slice(0,3).join(", ") + (a.length>3 ? ", 等" : "")) : "佚名";
  const t = r.title && r.title!=="—" ? r.title : r.filename;
  const y = r.year && r.year!=="—" ? `${r.year}.` : "";
  return `${who}. ${t}[J]. ${y}`.trim();
}
/* APA：Family, F. (Year). Title.（西文名转为"姓, 名首字母"；中文名保持原样） */
function apaName(n){
  n = String(n).trim();
  if(!n.includes(" ")) return n;
  const parts = n.split(/\s+/);
  const family = parts.pop();
  const given = parts.map(p=>p[0].toUpperCase()+".").join("");
  return `${family}, ${given}`;
}
function citeAPA(r){
  const a = realAuthors(r.authors).map(apaName);
  let who;
  if(!a.length) who = "佚名";
  else if(a.length===1) who = a[0];
  else if(a.length===2) who = a.join(" & ");
  else who = a.join(", ");
  const y = r.year && r.year!=="—" ? `(${r.year}).` : "(n.d.).";
  const t = r.title && r.title!=="—" ? r.title : r.filename;
  return `${who} ${y} ${t}.`;
}
function exportCols(){
  return COLUMNS.filter(c=>!["status","ops"].includes(c.key) &&
    (c.key==="filename" || !settings.hiddenCols.includes(c.key)));
}
function mdCell(v){
  return String(Array.isArray(v)?v.join("; "):(v??"")).replace(/\|/g,"\\|").replace(/\r?\n/g," ");
}
function buildMarkdownTable(rows){
  const cols = exportCols();
  const lines = ["| " + cols.map(c=>c.label).join(" | ") + " |",
                 "|" + cols.map(()=> "---").join("|") + "|"];
  for(const r of rows) lines.push("| " + cols.map(c=>mdCell(r[c.key])).join(" | ") + " |");
  return lines.join("\n");
}

      keywords:["BERT","预训练","双向编码","NLP"],

/* ============ 导出 / 备份 ============ */
function downloadFile(content, filename, mime){
  const blob = new Blob([content], {type:mime});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click(); URL.revokeObjectURL(a.href);
}
$("#btn-export").addEventListener("click", e=>{
  e.stopPropagation();
  if(records.length===0){ toast("暂无数据可导出", "warn"); return; }
  openMenu(e.currentTarget, [
    { label:"📄 导出 CSV（Excel 直开）", action:()=>{
      const cols = exportCols();
      const cell = v => {
        let s = Array.isArray(v) ? v.join("; ") : String(v ?? "");
        s = s.replace(/\r?\n/g," ");
        return '"' + s.replace(/"/g,'""') + '"';
      };
      const lines = [cols.map(c=>c.label).map(cell).join(",")].concat(
        records.map(r=>cols.map(c=>cell(r[c.key])).join(","))
      );
      downloadFile("\uFEFF" + lines.join("\r\n"),
        "文献提炼表_" + new Date().toISOString().slice(0,10) + ".csv", "text/csv;charset=utf-8;");
      toast("CSV 已导出", "ok");
    }},
    { label:"📝 导出 Markdown 表格", action:()=>{
      downloadFile(buildMarkdownTable(records),
        "文献提炼表_" + new Date().toISOString().slice(0,10) + ".md", "text/markdown;charset=utf-8;");
      toast("Markdown 已导出", "ok");
    }},
    { label:"💾 导出备份（JSON，含全文）", action:()=>{
      const data = { app:"PaperLens", version:2, exported_at:new Date().toISOString(),
        records: records.map(r=>{ const {text, ...rest} = r; return rest; }), texts: textCache };
      downloadFile(JSON.stringify(data, null, 1),
        "paperlens_backup_" + new Date().toISOString().slice(0,10) + ".json", "application/json");
      toast("备份已导出（表格 + 全文）", "ok");
    }},
    { label:"📥 导入备份（JSON）", action:()=> $("#backup-input").click() },
  ]);
});
$("#backup-input").addEventListener("change", async ()=>{
  const f = $("#backup-input").files[0]; $("#backup-input").value = "";
  if(!f) return;
  if(busy){ toast("正在分析中，请等当前任务完成后再导入", "warn", 5000); return; }
  try{
    const data = JSON.parse(await f.text());
    if(data.app !== "PaperLens" || !Array.isArray(data.records)) throw new Error("不是有效的 PaperLens 备份文件");
    if(!confirm(`导入将覆盖当前 ${records.length} 条记录，替换为备份中的 ${data.records.length} 条，继续？`)) return;
    records = data.records;
    for(const k of Object.keys(textCache)) delete textCache[k];
    Object.assign(textCache, data.texts || {});
    for(const r of records) r.text = textCache[r.id] || "";
    await idbClearAll();
    for(const [k,v] of Object.entries(textCache)) await idbSet(k, v);
    saveRecords(); render();
    toast(`已导入 ${records.length} 条记录`, "ok");
  }catch(err){
    toast("导入失败：" + err.message, "err", 6000);
  }
});

/* ============ Zotero 联动 ============ */
const BRIDGE = location.protocol.startsWith("http") ? "" : "http://127.0.0.1:3002";

let zoteroTimer = null, lastZoteroKey = null, zoteroBridgeOk = null;
function setZoteroBtn(state, label){
  const b = $("#btn-zotero");
  b.dataset.state = state;
  b.textContent = label;
}
async function zoteroPoll(){
  let data;
  try{
    const res = await fetch(BRIDGE + "/selected", {signal: AbortSignal.timeout(15000)});
    if(!res.ok) throw new Error("HTTP " + res.status);
    data = await res.json();
  }catch(e){
    if(zoteroBridgeOk !== false){
      zoteroBridgeOk = false;
      setZoteroBtn("err", "🔌 Zotero 联动：未连接");
      toast("Zotero 联动失败：请用 PaperLens.exe 启动（或先运行 python app.py），并确保 Zotero 已开启", "err", 7000);
    }
    return;
  }
  if(zoteroBridgeOk !== true){
    zoteroBridgeOk = true;
    setZoteroBtn("on", "🔌 Zotero 联动：监听中");
    toast("Zotero 联动已就绪：在 Zotero 中选中文献即可自动分析", "ok");
  }
  if(data.error === "bbt_missing"){
    lastZoteroKey = null;
    if(!zoteroPoll._bbtWarned){
      zoteroPoll._bbtWarned = true;
      toast("Zotero 已连接，但 Better BibTeX 未就绪（未安装或启动失败，重启 Zotero 可恢复）", "warn", 7000);
    }
    return;
  }
  if(data.error === "local_api_disabled"){
    lastZoteroKey = null;
    if(!zoteroPoll._apiWarned){
      zoteroPoll._apiWarned = true;
      toast("Zotero 本地 API 未开启。请在 Zotero 菜单「工具 → 开发者 → Run JavaScript」中运行：Zotero.Prefs.set(\"httpServer.localAPI.enabled\", true)，然后重启 Zotero", "warn", 12000);
    }
    return;
  }
  if(data.error === "no_selection"){ lastZoteroKey = null; return; }
  if(!data.key || data.key === lastZoteroKey) return;
  lastZoteroKey = data.key;
  if(data.error === "no_pdf"){ toast(`「${data.title || data.key}」没有找到 PDF 附件，跳过`, "warn"); return; }
  const existing = records.find(r=>r.zoteroKey === data.key);
  if(existing){
    // 已在表格中：不重复添加，改为选中该行；同时用 Zotero 元数据回填旧版导入时缺失的字段
    let filled = [];
    const needTitle = !existing.title || existing.title==="—";
    const needYear = !existing.year || existing.year==="—";
    const needAuthors = !Array.isArray(existing.authors) || existing.authors.length===0 ||
      (existing.authors.length===1 && existing.authors[0]==="未提及");
    if(needTitle && data.title){ existing.title = data.title; filled.push("标题"); }
    if(needAuthors && Array.isArray(data.authors) && data.authors.length){ existing.authors = data.authors; filled.push("作者"); }
    if(needYear && data.year){ existing.year = data.year; filled.push("年份"); }
    if(filled.length) saveRecords();
    rowClick(existing.id, false);
    toast(filled.length
      ? `「${existing.title || existing.filename}」已在表格中，已补全${filled.join("/")}并选中该行`
      : `「${existing.title || existing.filename}」已在表格中，已为你选中该行`, "ok", 4000);
    return;
  }
  zoteroAutoAdd(data);
}
async function zoteroAutoAdd(d){
  if(!pCfg().key){ toast("Zotero：检测到新文献，但未配置 API Key，请在「设置」中填写", "warn", 6000); return; }
  if(!d.pdf_base64){ toast(`「${d.title || d.key}」没有 PDF 内容可分析`, "warn"); return; }
  const bytes = Uint8Array.from(atob(d.pdf_base64), c=>c.charCodeAt(0));
  const file = new File([bytes], d.filename || (d.key + ".pdf"), {type:"application/pdf"});
  const rec = { id:uid(), filename:file.name, zoteroKey:d.key,
    status:"parsing", statusText:"", errMsg:"", text:"",
    title:d.title || "—",
    authors:(Array.isArray(d.authors) && d.authors.length) ? d.authors : ["未提及"],
    year:d.year || "—",
    keywords:["未提及"], research_question:"—", methodology:"—", data_and_sample:"—",
    main_findings:"—", innovation:"—", limitations:"—", one_sentence_summary:"—" };
  records.unshift(rec); saveRecords(); render();
  toast(`Zotero：开始分析「${rec.title}」`, "ok");
  processRecord(rec, file);
}
function setZoteroLink(on){
  settings.zotero = on; saveSettings();
  if(on){
    setZoteroBtn("on", "🔌 Zotero 联动：监听中");
    zoteroPoll();
    zoteroTimer = setInterval(zoteroPoll, 2500);
  }else{
    if(zoteroTimer){ clearInterval(zoteroTimer); zoteroTimer = null; }
    zoteroBridgeOk = null; lastZoteroKey = null; zoteroPoll._bbtWarned = false; zoteroPoll._apiWarned = false;
    setZoteroBtn("off", "🔌 Zotero 联动：关");
  }
}

/* ============ 统计面板 ============ */
function barList(pairs){
  const max = Math.max(1, ...pairs.map(p=>p[1]));
  return pairs.map(([k,n])=>`<div class="bar-row"><span class="bar-label" title="${esc(k)}">${esc(k)}</span><div class="bar-track"><div class="bar" style="width:${Math.round(n/max*100)}%"></div></div><span class="bar-num">${n}</span></div>`).join("");
}
$("#btn-stats").addEventListener("click", ()=>{
  if(records.length===0){ toast("暂无数据，先导入几篇文献再看统计", "warn"); return; }
  const done = records.filter(r=>r.status==="done").length;
  const fail = records.filter(r=>r.status==="fail").length;
  const translated = records.filter(r=>r.title_zh || r.summary_zh).length;
  const summary = `<div class="stats-summary">共 ${records.length} 篇 · 完成 ${done} · 失败 ${fail} · 已翻译 ${translated}</div>`;
  const yearCount = {};
  for(const r of records){
    const y = (r.year && r.year!=="—" && r.year!=="未提及") ? String(r.year) : "未知";
    yearCount[y] = (yearCount[y]||0) + 1;
  }
  const yearPairs = Object.entries(yearCount).sort((a,b)=>{
    const na = /^\d{4}$/.test(a[0]) ? +a[0] : Infinity;
    const nb = /^\d{4}$/.test(b[0]) ? +b[0] : Infinity;
    return na - nb;
  });
  const kwCount = {};
  for(const r of records){
    const arr = Array.isArray(r.keywords)?r.keywords:[];
    for(const k of arr){ if(k && k!=="未提及") kwCount[k] = (kwCount[k]||0) + 1; }
  }
  const kwPairs = Object.entries(kwCount).sort((a,b)=>b[1]-a[1]).slice(0,12);
  $("#stats-body").innerHTML = summary
    + `<div class="stats-section">年份分布</div>${barList(yearPairs)}`
    + `<div class="stats-section">高频关键词（前 ${kwPairs.length}）</div>${barList(kwPairs)}`;
  $("#stats-mask").classList.add("show");
});
$("#btn-stats-close").addEventListener("click", ()=> $("#stats-mask").classList.remove("show"));
$("#stats-mask").addEventListener("click", e=>{ if(e.target.id==="stats-mask") $("#stats-mask").classList.remove("show"); });

/* ============ arXiv / DOI 导入 ============ */
function parseLink(raw){
  const s = raw.trim();
  let m = s.match(/arxiv\.org\/(?:abs|pdf)\/([^\s?#]+)/i) || s.match(/^arxiv[:：]\s*([^\s]+)/i);
  if(m) return { type:"arxiv", id: m[1].replace(/\.pdf$/i,"") };
  m = s.match(/^(10\.\d{4,9}\/\S+)$/);
  if(m) return { type:"doi", id: m[1].replace(/[.,;]$/,"") };
  return null;
}
function bufToB64(buf){
  const bytes = new Uint8Array(buf);
  let bin = "";
  const CH = 0x8000;   // 分块转换，避免大文件超栈
  for(let i=0;i<bytes.length;i+=CH){
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i+CH));
  }
  return btoa(bin);
}
async function importLink(){
  const raw = $("#link-in").value;
  const target = parseLink(raw);
  if(!target){ toast("无法识别：请粘贴 arXiv 链接（arxiv.org/abs/…）或 DOI（10.xxxx/…）", "warn", 5000); return; }
  if(target.type==="arxiv"){
    toast(`正在从 arXiv 下载 ${target.id} 的 PDF…`, "ok", 4000);
    try{
      let d;
      if(BRIDGE){
        const r = await fetch(BRIDGE + "/fetch_arxiv?id=" + encodeURIComponent(target.id), {signal: AbortSignal.timeout(120000)});
        d = await r.json();
      }else{
        // 无本地服务：直接从 arXiv 拉取（arXiv 支持 CORS 时可用）
        const r = await fetch("https://arxiv.org/pdf/" + encodeURIComponent(target.id));
        if(!r.ok) throw new Error("HTTP " + r.status);
        d = { pdf_base64: bufToB64(await r.arrayBuffer()),
             filename: "arXiv-" + target.id.replace("/","_") + ".pdf" };
      }
      if(d.error) throw new Error(d.detail || d.error);
      const bytes = Uint8Array.from(atob(d.pdf_base64), c=>c.charCodeAt(0));
      const file = new File([bytes], d.filename, {type:"application/pdf"});
      $("#link-in").value = "";
      handleFiles([file]);
    }catch(err){
      toast("arXiv 下载失败：" + err.message + (BRIDGE ? "" : "（建议用 PaperLens.exe 启动后重试）"), "err", 7000);
    }
  }else{
    // DOI：走 Crossref 公开 API 导入元数据（浏览器直连，支持 CORS）
    toast(`正在从 Crossref 获取 DOI 元数据…`, "ok", 3000);
    try{
      const r = await fetch("https://api.crossref.org/works/" + encodeURIComponent(target.id), {signal: AbortSignal.timeout(20000)});
      if(!r.ok) throw new Error("HTTP " + r.status);
      const msg = (await r.json()).message;
      const yparts = (((msg.issued || {})["date-parts"] || [[]])[0]) || [];
      const authors = (msg.author || []).map(a=>[a.family, a.given].filter(Boolean).join(" ")).filter(Boolean);
      const rec = { id:uid(), filename:(target.id + ".doi"), zoteroKey:null,
        status:"fail", statusText:"缺 PDF", errMsg:"元数据已从 Crossref 导入；未找到公开 PDF，请上传该文献的 PDF 文件后点「重新分析」",
        title: (msg.title && msg.title[0]) || "—",
        authors: authors.length ? authors : ["未提及"],
        year: String(yparts[0] || "—"),
        keywords:["未提及"], research_question:"—", methodology:"—", data_and_sample:"—",
        main_findings:"—", innovation:"—", limitations:"—", one_sentence_summary:"—",
        text:"" };
      records.unshift(rec); saveRecords(); render();
      $("#link-in").value = "";
      toast(`已导入 DOI 元数据：「${rec.title}」`, "ok");
    }catch(err){
      toast("DOI 导入失败：" + err.message, "err", 6000);
    }
  }
}
$("#btn-link").addEventListener("click", importLink);
$("#link-in").addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); importLink(); } });

(async ()=>{  // 从 IndexedDB 回填全文到内存，供问答/重新分析使用
  try{
    const db = await idbOpen();
    const store = db.transaction("texts","readonly").objectStore("texts");
    const keys = await new Promise((res,rej)=>{ const rq=store.getAllKeys(); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); });
    for(const k of keys){ textCache[k] = await idbGet(k); }
    for(const r of records){ r.text = textCache[r.id] || ""; }
  }catch(e){}
  render();
})();
